name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/vartaxnews/VartaXnews
            git fetch origin
            git reset --hard origin/main
            if [ ! -f docker-compose.yml ] && [ ! -f compose.yaml ]; then
              echo "Error: docker-compose.yml or compose.yaml not found in /opt/vartaxnews/VartaXnews"
              exit 1
            fi
            docker compose up -d --build
            sleep 5
            curl --fail http://127.0.0.1:3001
            git log -1 --oneline
