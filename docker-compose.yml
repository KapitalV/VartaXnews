services:
  vartaxnews:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    container_name: vartaxnews-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
