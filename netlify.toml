[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/ai/generate-news"
  to = "/.netlify/functions/generate-news"
  status = 200

[[redirects]]
  from = "/api/ai/generate-horoscope"
  to = "/.netlify/functions/generate-horoscope"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
